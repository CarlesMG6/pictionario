<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,600;0,700;0,800;1,800;1,900&display=swap">
  <style>
    body { margin: 0; font-family: Nunito, 'Trebuchet MS', sans-serif; }

    .gp-panel {
      background: #FDF6E8; color: #23222b;
      border: 3px solid #23222b; border-radius: 8px;
      box-shadow: 0 5px 0 rgba(35, 34, 43, 0.4);
    }
    .gp-label { text-transform: uppercase; letter-spacing: 0.09em; font-weight: 700; }
    .gp-caption { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; font-size: 0.68rem; opacity: 0.62; }
    .gp-display { font-family: 'Baloo 2', Nunito, sans-serif; font-weight: 800; }
    .gp-button {
      border: 3px solid #23222b; border-radius: 8px;
      box-shadow: 0 4px 0 rgba(35, 34, 43, 0.4);
      cursor: pointer;
    }

    /* Cada teléfono: cielo arriba, mar abajo y la franja del color del equipo
       que juega cruzando el borde superior. */
    .phone {
      position: relative; width: 390px; height: 844px; flex: none;
      border: 3px solid #23222b; border-radius: 30px; overflow: hidden;
      background: linear-gradient(180deg, #6FCDF2 0%, #A6E1F7 46%, #CDEEFF 74%);
      box-shadow: 0 6px 0 rgba(35,34,43,0.35);
    }
    .phone .sea { position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
      background: linear-gradient(180deg, rgba(143,229,240,0) 0%, #8FE5F0 26%, #3FB8DE 62%, #1B8FC4 100%); }
    .turnstrip { position: relative; height: 7px; }
    .idbar { position: relative; display: flex; align-items: center; gap: 12px;
      background: #FDF6E8; border-bottom: 3px solid #23222b; padding: 10px 16px; }
    .idbar .avatar { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #23222b;
      display: flex; align-items: center; justify-content: center; flex: none; }
    .stage { position: relative; display: flex; flex-direction: column; gap: 16px;
      padding: 36px 16px 20px 16px; height: calc(844px - 7px - 67px); box-sizing: border-box; }

    .card { position: relative; flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px 20px 24px 20px; }

    .tile { position: relative; width: 62px; height: 71px; }
    .tile i { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%; display: block; }
    .tile .base { bottom: 0; width: 62px; height: 22px; background: #FBF3E2; box-shadow: 0 3px 0 rgba(27,55,80,0.22); }
    .tile .rim { bottom: 7px; width: 52px; height: 19px; filter: brightness(0.72); }
    .tile .top { bottom: 13px; width: 52px; height: 42px; display: flex; align-items: center; justify-content: center; }

    /* La palabra nunca se esconde del todo: se ve borrosa, y eso dice que hay
       algo debajo mucho mejor que un rótulo de «palabra oculta». */
    .word { font-family: 'Baloo 2', Nunito, sans-serif; font-weight: 800; font-size: 40px;
      color: #23222b; text-align: center; }
    .word.hidden { filter: blur(15px); opacity: 0.42; transform: scale(1.04); }

    .mark { position: absolute; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; justify-content: center; opacity: 0.55; }

    /* Dado de arcilla: puntos, no cifras. */
    .die { position: relative; width: 138px; height: 138px; background: #FBF3E2;
      border: 3px solid #23222b; border-radius: 26px; box-sizing: border-box; padding: 17px;
      display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
    .die span { display: flex; align-items: center; justify-content: center; }
    .die b { display: block; width: 22px; height: 22px; border-radius: 50%; background: #23222b; }
    .die-shadow { position: absolute; left: 50%; bottom: -18px; width: 110px; height: 24px;
      transform: translateX(-50%); border-radius: 50%; background: rgba(27,55,80,0.26); filter: blur(6px); }

    .caplabel { font-family: Nunito, sans-serif; text-transform: uppercase; letter-spacing: 0.12em;
      font-weight: 800; font-size: 12px; color: #23222b; opacity: 0.55; text-align: center; margin-top: 16px; }
  </style>
</helmet>

<div style="position: relative; width: 1760px; height: 980px; background: #EAF7FF; padding: 40px; box-sizing: border-box;">
  <div style="display: flex; gap: 40px;">

    <!-- 1 · LEER LA PALABRA Y EMPEZAR ------------------------------------- -->
    <div>
      <div class="phone">
        <div class="sea"></div>
        <div class="turnstrip" style="background: #ef4444;"></div>
        <div class="idbar">
          <span class="avatar" style="background: #ef4444;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M5 20c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5z"/><circle cx="12" cy="7.5" r="4"/></svg>
          </span>
          <span class="gp-label" style="font-size: 15px;">Los Garabatos</span>
        </div>

        <div class="stage">
          <div class="gp-panel card">
            <div class="gp-caption" style="margin-bottom: 14px;">Persona, animal o lugar</div>

            <div style="position: relative; flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;">
              <div class="word hidden">hora punta</div>
              <!-- El dedo con ondas enseña el gesto: mantener pulsado enfoca la
                   palabra, soltar la vuelve a tapar. -->
              <svg width="62" height="65" viewBox="0 0 48 50" fill="none" style="position: absolute; color: rgba(35,34,43,0.7);">
                <ellipse cx="24" cy="13" rx="9" ry="4" stroke="currentColor" stroke-width="2.2" opacity="0.5"/>
                <ellipse cx="24" cy="13" rx="14" ry="6" stroke="currentColor" stroke-width="2" opacity="0.26"/>
                <path d="M20.6 24V13.4a2.6 2.6 0 0 1 5.2 0V24" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M25.8 21.6l6.2 2.2a3 3 0 0 1 1.9 3.5l-1.4 5.6a4.4 4.4 0 0 1-4.3 3.3h-4.6a4.4 4.4 0 0 1-3.5-1.8l-3.7-5a2.3 2.3 0 0 1 3.4-3.1l2.8 2.4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <!-- Arrastrar la carta a la derecha reparte otra palabra; a la
                 izquierda vuelve a la anterior. En reposo no hay nada: el icono
                 aparece desde transparente a medida que avanza el dedo, y aquí
                 se enseña a media aparición. -->
            <div class="mark" style="right: -30px;">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#23222b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 12a8.2 8.2 0 1 1-2.6-6"/><path d="M20.4 3.4v5h-5"/></svg>
            </div>
          </div>

          <!-- Empezar la ronda es darle la vuelta al reloj de arena -->
          <div style="display: flex; justify-content: center; padding-top: 4px;">
            <div style="position: relative; display: flex; align-items: center; justify-content: center;">
              <span style="position: absolute; width: 118px; height: 118px; border-radius: 50%; background: rgba(247,201,72,0.35);"></span>
              <div class="gp-button" style="position: relative; width: 96px; height: 96px; border-radius: 999px; background: #f7c948; display: flex; align-items: center; justify-content: center;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" style="color: #23222b;">
                  <path d="M8 18.4h8l-4-5.4z" fill="#7a4e33"/>
                  <path d="M6.6 4.2h10.8l-5.4 7.8zM6.6 20.4h10.8l-5.4-7.8z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
                  <path d="M4.6 3.3h14.8M4.6 21.3h14.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="caplabel">Leer la palabra · empezar</div>
    </div>

    <!-- 2 · RONDA EN MARCHA ------------------------------------------------ -->
    <div>
      <div class="phone">
        <div class="sea"></div>
        <div class="turnstrip" style="background: #ef4444;"></div>
        <div class="idbar">
          <span class="avatar" style="background: #ef4444;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M5 20c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5z"/><circle cx="12" cy="7.5" r="4"/></svg>
          </span>
          <span class="gp-label" style="font-size: 15px;">Los Garabatos</span>
        </div>

        <div class="stage">
          <!-- El reloj va en una tira fina: se lee de reojo y no le quita sitio
               a la palabra, que es lo que hay que mirar. -->
          <div class="gp-panel" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px;">
            <div style="position: relative; flex: 1; height: 14px; border-radius: 999px; background: rgba(35,34,43,0.14); overflow: hidden;">
              <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 73%; border-radius: 999px; background: #2b9e57;"></div>
            </div>
            <span class="gp-display" style="font-size: 21px; width: 32px; text-align: right;">33</span>
          </div>

          <div class="gp-panel card">
            <div class="gp-caption" style="margin-bottom: 14px;">Persona, animal o lugar</div>
            <div style="flex: 1; display: flex; align-items: center;">
              <div class="word">hora punta</div>
            </div>
          </div>

          <!-- El acierto ocupa casi todo el ancho: es lo que se pulsa con prisa
               cuando alguien grita la palabra. El fallo queda a un lado. -->
          <div style="display: flex; gap: 12px; align-items: stretch;">
            <div class="gp-button" style="width: 84px; height: 84px; border-radius: 999px; background: #FDF6E8; display: flex; align-items: center; justify-content: center;">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#dc4b3e" stroke-width="3.4" stroke-linecap="round"><path d="M6.4 6.4 17.6 17.6M17.6 6.4 6.4 17.6"/></svg>
            </div>
            <div class="gp-button" style="flex: 1; height: 84px; background: #2b9e57; display: flex; align-items: center; justify-content: center;">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8 10 18.4 19.6 6.4"/></svg>
            </div>
          </div>
        </div>
      </div>
      <div class="caplabel">Dibujando · acierto o fallo</div>
    </div>

    <!-- 3 · TIRAR EL DADO --------------------------------------------------- -->
    <div>
      <div class="phone">
        <div class="sea"></div>
        <div class="turnstrip" style="background: #ef4444;"></div>
        <div class="idbar">
          <span class="avatar" style="background: #ef4444;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M5 20c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5z"/><circle cx="12" cy="7.5" r="4"/></svg>
          </span>
          <span class="gp-label" style="font-size: 15px;">Los Garabatos</span>
        </div>

        <!-- No hay botón de tirar: está el dado, y se lanza hacia arriba con el
             dedo. Los galones suben en cascada para enseñar el gesto. -->
        <div class="stage" style="justify-content: flex-end; align-items: center; padding-bottom: 24px;">
          <svg width="40" height="50" viewBox="0 0 24 30" fill="none" style="color: rgba(35,34,43,0.45); margin-bottom: 10px;">
            <path d="M5 20 12 13 19 20" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
            <path d="M5 13 12 6 19 13" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
            <path d="M5 6 12 -1 19 6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
          </svg>
          <div style="position: relative;">
            <span class="die-shadow"></span>
            <div class="die">
              <span><b></b></span><span></span><span><b></b></span>
              <span></span><span><b></b></span><span></span>
              <span><b></b></span><span></span><span><b></b></span>
            </div>
          </div>
        </div>
      </div>
      <div class="caplabel">Lanzar el dado con el dedo</div>
    </div>

    <!-- 4 · ESPERANDO A OTRO EQUIPO ----------------------------------------- -->
    <div>
      <div class="phone">
        <div class="sea"></div>
        <div class="turnstrip" style="background: #3b82f6;"></div>
        <div class="idbar">
          <span class="avatar" style="background: #ef4444;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M5 20c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5z"/><circle cx="12" cy="7.5" r="4"/></svg>
          </span>
          <span class="gp-label" style="font-size: 15px;">Los Garabatos</span>
        </div>

        <!-- Sin turno no hay ningún control en pantalla: solo quién juega y el
             mismo reloj que ve la sala. -->
        <div class="stage" style="justify-content: center; align-items: center; gap: 28px;">
          <div style="display: flex; flex-direction: column; align-items: center;">
            <span style="width: 96px; height: 96px; border-radius: 50%; border: 3px solid #23222b; background: #3b82f6; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 rgba(35,34,43,0.35);">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="#fff"><path d="M5 20c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5z"/><circle cx="12" cy="7.5" r="4"/></svg>
            </span>
            <span class="gp-label" style="font-size: 16px; margin-top: 12px;">Manos de Mantequilla</span>
          </div>

          <div style="position: relative; width: 136px; height: 136px;">
            <div style="position: absolute; inset: 0; border-radius: 50%; background: #FBF3E2; border: 3px solid #23222b; box-shadow: 0 4px 0 rgba(35,34,43,0.38);"></div>
            <svg width="136" height="136" style="position: absolute; inset: 0; transform: rotate(-90deg);">
              <circle cx="68" cy="68" r="55" fill="none" stroke="#23222b" stroke-opacity="0.14" stroke-width="12"/>
              <circle cx="68" cy="68" r="55" fill="none" stroke="#2b9e57" stroke-width="12" stroke-linecap="round" stroke-dasharray="345.6" stroke-dashoffset="93"/>
            </svg>
            <div class="gp-display" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 46px; color: #23222b;">33</div>
          </div>
        </div>
      </div>
      <div class="caplabel">Sin turno · solo mirar</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
