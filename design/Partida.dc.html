<!doctype html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,600;0,700;0,800;1,800;1,900&display=swap">
  <style>
    body { margin: 0; font-family: Nunito, 'Trebuchet MS', sans-serif; }

    .gp-panel {
      background: #FDF6E8; color: #23222b;
      border: 3px solid #23222b; border-radius: 8px;
      box-shadow: 0 5px 0 rgba(35, 34, 43, 0.4);
    }
    .gp-label { text-transform: uppercase; letter-spacing: 0.09em; font-weight: 700; }
    .gp-caption { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; font-size: 0.68rem; opacity: 0.62; }
    .gp-number { font-style: italic; font-weight: 900; letter-spacing: -0.03em; }
    .gp-display { font-family: 'Baloo 2', Nunito, sans-serif; font-weight: 800; }

    /* La casilla del tablero, en DOM. Misma anatomía que PathTile en 3D:
       anillo crema, disco de color, glifo blanco. */
    .tile { position: relative; width: 76px; height: 87px; flex: none; }
    .tile i { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%; display: block; }
    .tile .base { bottom: 0; width: 76px; height: 27px; background: #FBF3E2; box-shadow: 0 3px 0 rgba(27,55,80,0.22); }
    .tile .rim { bottom: 9px; width: 64px; height: 24px; filter: brightness(0.72); }
    .tile .top { bottom: 16px; width: 64px; height: 52px; display: flex; align-items: center; justify-content: center; }

    .cloud { position: absolute; background: #fff; border-radius: 999px; opacity: 0.9; }
  </style>
</helmet>

  <!-- Velo suave del escenario: aclara el centro lo justo para que el reloj y
       los rótulos se lean sobre el mundo, sin apagarlo como hacía el modal. -->

  <!-- HUD PERMANENTE -------------------------------------------------------->

  <!-- Categoría en juego: solo el nombre. El icono y el color ya están en la
       casilla que el peón tiene debajo, en el propio tablero. -->

    <div class="gp-panel gp-label" style="font-size: 21px; padding: 14px 32px;">Persona, animal o lugar</div>
